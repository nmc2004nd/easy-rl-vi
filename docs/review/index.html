<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập · Sách Nấm EasyRL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #eef1f4;
    --text: #1d2430;
    --muted: #5d6878;
    --border: #dde2e8;
    --accent: #42b983;
    --accent-soft: #e3f5ec;
    --accent-text: #1f7a52;
    --again: #d9534f;
    --again-soft: #fbe9e8;
    --hard: #c98a12;
    --hard-soft: #fbf1dc;
    --good: #2e8b57;
    --good-soft: #e3f3ea;
    --shadow: 0 1px 2px rgba(20, 30, 45, .06), 0 6px 20px rgba(20, 30, 45, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c;
      --surface: #1a2028;
      --surface-2: #232b35;
      --text: #e6eaef;
      --muted: #9aa5b3;
      --border: #2e3844;
      --accent: #4cc893;
      --accent-soft: #1b3329;
      --accent-text: #7fdcb2;
      --again: #f07470;
      --again-soft: #3a2223;
      --hard: #e3ac45;
      --hard-soft: #382d18;
      --good: #5ccf8e;
      --good-soft: #1b3326;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c;
    --surface: #1a2028;
    --surface-2: #232b35;
    --text: #e6eaef;
    --muted: #9aa5b3;
    --border: #2e3844;
    --accent: #4cc893;
    --accent-soft: #1b3329;
    --accent-text: #7fdcb2;
    --again: #f07470;
    --again-soft: #3a2223;
    --hard: #e3ac45;
    --hard-soft: #382d18;
    --good: #5ccf8e;
    --good-soft: #1b3326;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
  header h1 { font-size: 1.35rem; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  header .links { display: flex; gap: 14px; font-size: .9rem; }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-bottom: 18px; }
  .tab {
    flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: .95rem;
    padding: 9px 8px; border-radius: 9px; cursor: pointer;
  }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tab { white-space: nowrap; }
  .answer { margin-top: 12px; }
  .answer textarea {
    width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    font: inherit; color: var(--text); background: var(--surface);
  }
  .answer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .answer .row { align-items: center; justify-content: space-between; margin-top: 8px; }
  .opt-type { font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .card .mine { margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); white-space: pre-line; }
  .card .lbl2 { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .card .back .lbl2 { margin-bottom: 4px; }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .tab:focus-visible, button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; font-size: .85rem; color: var(--muted); }
  .pill b { color: var(--text); font-weight: 600; }

  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
    padding: 22px 22px 18px; min-height: 260px; display: flex; flex-direction: column; cursor: pointer; user-select: none;
  }
  .card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
  .tagchip { background: var(--accent-soft); color: var(--accent-text); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
  .card .front { font-size: 1.15rem; font-weight: 600; line-height: 1.5; }
  .card .back { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); white-space: pre-line; }
  .card .hint { margin-top: auto; padding-top: 16px; text-align: center; color: var(--muted); font-size: .85rem; }
  .card.flipped { cursor: default; }

  .grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .grade {
    border: 1px solid transparent; border-radius: 12px; padding: 10px 6px; font: inherit; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; line-height: 1.3;
  }
  .grade small { font-weight: 500; opacity: .8; font-size: .78rem; }
  .grade.again { background: var(--again-soft); color: var(--again); border-color: var(--again); }
  .grade.hard { background: var(--hard-soft); color: var(--hard); border-color: var(--hard); }
  .grade.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  .grade:hover { filter: brightness(.97); }

  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 16px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:hover { filter: brightness(.97); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .muted { color: var(--muted); }
  .kbd { font-size: .8rem; color: var(--muted); margin-top: 12px; text-align: center; }
  kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-family: inherit; font-size: .78rem; background: var(--surface); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; }
  .panel h2 { margin: 0 0 6px; font-size: 1.15rem; }

  .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress > span { display: block; height: 100%; background: var(--accent); transition: width .25s; }

  .qtext { font-size: 1.08rem; font-weight: 600; margin-bottom: 14px; }
  .opts { display: grid; gap: 8px; }
  .opt {
    text-align: left; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px;
    padding: 11px 14px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: flex-start;
  }
  .opt .letter { font-weight: 700; color: var(--muted); min-width: 1.2em; }
  .opt:hover:not([disabled]) { border-color: var(--accent); }
  .opt[disabled] { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.wrong { border-color: var(--again); background: var(--again-soft); }
  .explain { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
  .explain .verdict { font-weight: 700; margin-bottom: 4px; }
  .explain .verdict.ok { color: var(--good); }
  .explain .verdict.no { color: var(--again); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0 4px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
  .stat .n { font-size: 1.5rem; font-weight: 700; }
  .stat .l { font-size: .82rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-top: 12px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .lvl { font-size: .75rem; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .lvl.new { background: var(--surface-2); color: var(--muted); }
  .lvl.learn { background: var(--hard-soft); color: var(--hard); }
  .lvl.known { background: var(--good-soft); color: var(--good); }
  .note { font-size: .85rem; color: var(--muted); margin-top: 12px; }
  .katex { font-size: 1.05em; }
  .katex-display { margin: .6em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: var(--surface-2); border-radius: 5px; padding: 1px 5px; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .95; }

  /* Chứng minh */
  .pintro { margin-bottom: 14px; }
  .plist { display: grid; gap: 12px; }
  .pitem { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px; }
  .pitem .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 8px; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  .pitem h3 { margin: 0; font-size: 1.02rem; line-height: 1.45; }
  .pitem .row { margin-top: 8px; gap: 8px; }
  .btn.pmode { padding: 7px 12px; font-size: .88rem; }
  .btn.pmode.done { border-color: var(--good); color: var(--good); }
  .ptop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .pseg { display: inline-flex; flex-wrap: wrap; gap: 3px; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .pseg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: .88rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .pseg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .pgiven { background: var(--surface-2); border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-size: .95rem; }
  .pgiven .lbl2, .psol, .ppool-l, .pgrade .lbl2 { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .psol, .ppool-l { margin-top: 14px; }
  .pstep { border-left: 3px solid var(--border); padding: 0 10px; margin: 6px 0; border-radius: 0 8px 8px 0; }
  .pstep .katex-display { margin: .35em 0; text-align: left; }
  .pstep .katex-display > .katex { text-align: left; }
  .ptex.cont { padding-left: 1.6em; }
  .pstep.fixed { border-left-color: var(--muted); }
  .pstep.cur { border-left-color: var(--accent); background: var(--accent-soft); }
  .pstep[role="button"] { cursor: pointer; border: 1px solid var(--border); border-left-width: 3px; border-radius: 10px; background: var(--surface); }
  .pstep[role="button"]:hover { border-color: var(--accent); }
  .pstep.ok { border-color: var(--good) !important; background: var(--good-soft); }
  .pstep.bad { border-color: var(--again) !important; background: var(--again-soft); }
  .ppool { display: grid; gap: 6px; margin-top: 6px; padding: 8px; border: 1px dashed var(--border); border-radius: 12px; }
  .ppool .pstep { margin: 0; }
  .reason { font-size: .85rem; color: var(--muted); margin: -2px 0 6px; }
  .phint { background: var(--hard-soft); border-radius: 12px; padding: 8px 12px; margin: 8px 0; }
  .phint .lbl2 { color: var(--hard); }
  .pgrade { margin-top: 16px; }
  .pnote { font-size: .9rem; margin: 12px 0 6px; }
  .pq { font-weight: 600; margin: 12px 0 8px; }
  @media (max-width: 480px) {
    .tab { font-size: .82rem; padding: 8px 6px; }
    .card { padding: 18px 16px 14px; min-height: 240px; }
    .card .front { font-size: 1.05rem; }
    .panel { padding: 18px 16px; }
    .pstep .katex, .pgiven .katex-display .katex, .pitem .katex-display .katex { font-size: .95em; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Ôn tập</h1>
    <nav class="links">
      <a id="lnk-chapter" href="../">Đọc chương</a>
      <a id="lnk-ex" href="../">Bài tập</a>
      <a href="../">Trang chủ</a>
    </nav>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="cards">Flashcard</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="quiz">Quiz</button>
    <button class="tab hidden" role="tab" aria-selected="false" data-tab="proofs">Chứng minh</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="progress">Tiến độ</button>
  </div>

  <div id="err" class="panel hidden"></div>

  <!-- Flashcard -->
  <section id="tab-cards">
    <div class="stats" id="card-stats"></div>
    <div id="card-area"></div>
  </section>

  <!-- Quiz -->
  <section id="tab-quiz" class="hidden">
    <div id="quiz-area"></div>
  </section>

  <!-- Chứng minh (chỉ hiện khi chương có "proofs") -->
  <section id="tab-proofs" class="hidden">
    <div id="proof-area"></div>
  </section>

  <!-- Tiến độ -->
  <section id="tab-progress" class="hidden">
    <div class="panel" id="progress-area"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var DAY = 86400000;
  var STORE_KEY = 'easyrl-vi:review:v1';
  var params = new URLSearchParams(location.search);
  var CH = String(parseInt(params.get('ch') || '1', 10) || 1);

  var data = null;          // nội dung chương (thẻ + quiz)
  var store = loadStore();  // tiến độ của người học
  var chState = null;       // store.chapters[CH]

  // ---------- lưu trữ (localStorage có thể không dùng được: luôn bọc try/catch) ----------
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === 'object' && s.chapters) return s;
      }
    } catch (e) {}
    return { version: 1, chapters: {} };
  }
  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
  }
  function ensureChapter() {
    if (!store.chapters[CH]) store.chapters[CH] = { cards: {}, quiz: { best: null, last: null, attempts: 0 } };
    chState = store.chapters[CH];
    if (!chState.cards) chState.cards = {};
    if (!chState.quiz) chState.quiz = { best: null, last: null, attempts: 0 };
  }

  // ---------- tiện ích ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Định dạng tối giản: **đậm**, `code` và xuống dòng; công thức $...$ / $$...$$ do KaTeX hiển thị sau khi gắn vào trang
  function fmt(s) {
    return esc(s)
      .replace(/\n*(\$\$[\s\S]+?\$\$)\n*/g, '$1') // công thức khối tự xuống dòng, bỏ dòng trống thừa quanh nó
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }
  // Hiển thị công thức LaTeX trong một vùng; nếu KaTeX chưa tải xong thì thử lại sau
  function typeset(el, tries) {
    if (!el) return;
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(el, {
          delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
          throwOnError: false
        });
      } catch (e) {}
    } else if ((tries || 0) < 50) {
      setTimeout(function () { typeset(el, (tries || 0) + 1); }, 100);
    }
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function startOfToday() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function fmtDays(n) { return n <= 0 ? 'hôm nay' : n === 1 ? '1 ngày' : n + ' ngày'; }
  function fmtDate(ts) {
    var days = Math.round((ts - startOfToday()) / DAY);
    if (days <= 0) return 'hôm nay';
    if (days === 1) return 'ngày mai';
    return 'sau ' + days + ' ngày';
  }
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  // ---------- lịch ôn cách quãng (SM-2 rút gọn) ----------
  // Mỗi thẻ: { reps, interval (ngày), ease, due (mốc thời gian), lapses, seen }
  function cardState(id) { return chState.cards[id] || null; }
  function isDue(st, now) { return !st || st.due <= now; }
  function level(st) {
    if (!st || !st.seen) return 'new';
    if (st.interval >= 7) return 'known';
    return 'learn';
  }
  // Tính lịch mới cho một mức đánh giá, không ghi vào store
  function schedule(st, grade) {
    var s = st ? Object.assign({}, st) : { reps: 0, interval: 0, ease: 2.5, due: 0, lapses: 0, seen: 0 };
    if (grade === 'again') {
      s.lapses += 1; s.reps = 0; s.interval = 0; s.ease = Math.max(1.3, s.ease - 0.2);
    } else if (grade === 'hard') {
      s.interval = s.reps === 0 ? 1 : Math.max(s.interval + 1, Math.round(s.interval * 1.2));
      s.ease = Math.max(1.3, s.ease - 0.15); s.reps += 1;
    } else {
      s.interval = s.reps === 0 ? 2 : s.reps === 1 ? 5 : Math.round(s.interval * s.ease);
      s.reps += 1;
    }
    s.seen += 1;
    s.due = startOfToday() + s.interval * DAY;
    return s;
  }

  // ---------- Flashcard ----------
  var session = null; // { queue: [id], done: n, total: n, practice: bool, flipped: bool }

  function buildSession(practice) {
    var now = Date.now();
    var ids = data.cards.map(function (c) { return c.id; });
    var pick = practice ? ids : ids.filter(function (id) { return isDue(cardState(id), now); });
    // thẻ đến hạn ôn trước, thẻ mới sau
    var due = shuffle(pick.filter(function (id) { var s = cardState(id); return s && s.seen; }));
    var fresh = shuffle(pick.filter(function (id) { var s = cardState(id); return !s || !s.seen; }));
    var queue = practice ? shuffle(pick) : due.concat(fresh);
    session = { queue: queue, done: 0, total: queue.length, practice: !!practice, flipped: false };
  }

  function cardById(id) {
    for (var i = 0; i < data.cards.length; i++) if (data.cards[i].id === id) return data.cards[i];
    return null;
  }

  function renderCardStats() {
    var now = Date.now(), nNew = 0, nDue = 0, nKnown = 0;
    data.cards.forEach(function (c) {
      var s = cardState(c.id);
      if (!s || !s.seen) nNew++;
      else if (s.due <= now) nDue++;
      if (level(s) === 'known') nKnown++;
    });
    document.getElementById('card-stats').innerHTML =
      '<span class="pill">Cần ôn: <b>' + nDue + '</b></span>' +
      '<span class="pill">Thẻ mới: <b>' + nNew + '</b></span>' +
      '<span class="pill">Đã thuộc: <b>' + nKnown + '</b> / ' + data.cards.length + '</span>' +
      (session && session.total ? '<span class="pill">Phiên này: <b>' + session.done + '</b> / ' + session.total + (session.practice ? ' (ôn tự do)' : '') + '</span>' : '');
  }

  function nextDueText() {
    var min = Infinity;
    data.cards.forEach(function (c) { var s = cardState(c.id); if (s && s.seen && s.due < min) min = s.due; });
    return min === Infinity ? '' : fmtDate(min);
  }

  function renderCard() {
    renderCardStats();
    var area = document.getElementById('card-area');
    if (!session || !session.queue.length) {
      var nd = nextDueText();
      area.innerHTML =
        '<div class="panel"><h2>' + (session && session.total ? '🎉 Xong phiên ôn!' : '✅ Hôm nay không còn thẻ cần ôn') + '</h2>' +
        '<p class="muted">' + (nd ? 'Lần ôn tiếp theo: <b>' + esc(nd) + '</b>. ' : '') +
        'Ôn đúng hạn giúp nhớ lâu hơn là ôn dồn một lúc.</p>' +
        '<div class="row"><button class="btn" id="btn-practice">Ôn tự do tất cả thẻ</button>' +
        '<button class="btn" data-go="quiz">Làm quiz</button></div>' +
        '<p class="note">"Ôn tự do" không thay đổi lịch ôn.</p></div>';
      document.getElementById('btn-practice').onclick = function () { buildSession(true); renderCard(); };
      return;
    }
    var c = cardById(session.queue[0]);
    var st = cardState(c.id);
    var flipped = session.flipped;
    var html =
      '<div class="card' + (flipped ? ' flipped' : '') + '" id="the-card" tabindex="0" aria-live="polite">' +
        '<div class="meta"><span class="tagchip">' + esc(c.tag) + '</span><span>Mục ' + esc(c.ref) + '</span></div>' +
        '<div class="front">' + fmt(c.front) + '</div>' +
        (flipped
          ? (session.typed && session.typed.trim() ? '<div class="mine"><div class="lbl2">Bạn trả lời</div>' + esc(session.typed.trim()) + '</div>' : '') +
            '<div class="back">' + (typeMode() ? '<div class="lbl2">Đáp án</div>' : '') + fmt(c.back) + '</div>'
          : (typeMode() ? '' : '<div class="hint">Tự trả lời trong đầu (hoặc nói ra), rồi bấm để xem đáp án</div>')) +
      '</div>';
    if (!flipped && typeMode()) {
      html += '<div class="answer"><textarea id="ans" placeholder="Gõ câu trả lời của bạn trước khi xem đáp án (vài ý chính là đủ)…" aria-label="Câu trả lời của bạn">' +
        esc(session.typed || '') + '</textarea><div class="row"><button class="btn primary" id="btn-flip">Xem đáp án</button>' +
        '<span class="muted" style="font-size:.8rem"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span></div></div>';
    }
    if (flipped) {
      if (session.practice) {
        html += '<div class="grades" style="grid-template-columns:1fr 1fr">' +
          '<button class="grade again" data-grade="again">Chưa nhớ<small>xem lại sau</small></button>' +
          '<button class="grade good" data-grade="good">Nhớ<small>thẻ tiếp</small></button></div>';
      } else {
        var labels = { again: 'Quên', hard: 'Khó', good: 'Nhớ' };
        html += '<div class="grades">' + ['again', 'hard', 'good'].map(function (g) {
          var preview = g === 'again' ? 'ôn lại ngay' : fmtDays(schedule(st, g).interval);
          return '<button class="grade ' + g + '" data-grade="' + g + '">' + labels[g] + '<small>' + preview + '</small></button>';
        }).join('') + '</div>';
      }
      if (typeMode() && session.typed && session.typed.trim()) html += '<div class="kbd" style="margin-top:10px">So sánh với đáp án: bạn đã nêu được các ý <b>in đậm</b> chưa? Chấm trung thực để lịch ôn chính xác.</div>';
      html += '<div class="kbd">Phím tắt: <kbd>1</kbd> ' + (session.practice ? 'Chưa nhớ' : 'Quên') + (session.practice ? '' : ' · <kbd>2</kbd> Khó') + ' · <kbd>' + (session.practice ? '2' : '3') + '</kbd> Nhớ</div>';
    } else {
      html += '<div class="kbd">' + (typeMode() ? '' : 'Phím tắt: <kbd>Space</kbd> lật thẻ · ') +
        '<label class="opt-type"><input type="checkbox" id="opt-type"' + (typeMode() ? ' checked' : '') + '> Gõ câu trả lời trước khi lật</label></div>';
    }
    area.innerHTML = html;
    typeset(area);
    var cardEl = document.getElementById('the-card');
    if (!flipped) cardEl.onclick = flip;
    var ans = document.getElementById('ans');
    if (ans) {
      ans.oninput = function () { session.typed = ans.value; };
      ans.onkeydown = function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); flip(); } };
      document.getElementById('btn-flip').onclick = flip;
      // chỉ tự focus trên máy có chuột, tránh bật bàn phím ảo trên điện thoại
      try { if (window.matchMedia('(pointer: fine)').matches) ans.focus(); } catch (e) {}
    }
    var optType = document.getElementById('opt-type');
    if (optType) optType.onchange = function () {
      store.settings = store.settings || {}; store.settings.typeAnswer = optType.checked; saveStore(); renderCard();
    };
    area.querySelectorAll('.grade').forEach(function (b) { b.onclick = function () { grade(b.getAttribute('data-grade')); }; });
  }

  function typeMode() { return !store.settings || store.settings.typeAnswer !== false; }
  function flip() { if (session && session.queue.length && !session.flipped) { session.flipped = true; renderCard(); } }

  function grade(g) {
    if (!session || !session.flipped) return;
    var id = session.queue.shift();
    if (!session.practice) {
      chState.cards[id] = schedule(cardState(id), g);
      saveStore();
    }
    if (g === 'again') {
      // đưa thẻ quay lại sau vài thẻ nữa trong cùng phiên
      var pos = Math.min(session.queue.length, 3);
      session.queue.splice(pos, 0, id);
    } else {
      session.done += 1;
    }
    session.flipped = false;
    session.typed = '';
    renderCard();
  }

  // ---------- Quiz ----------
  var quiz = null; // { order: [idx], i, score, answered, wrong: [idx], optOrder: [] }

  function startQuiz(onlyIdx) {
    var idx = onlyIdx || data.quiz.map(function (_, i) { return i; });
    quiz = { order: shuffle(idx), i: 0, score: 0, answered: false, wrong: [], picked: null, optOrder: null };
    renderQuiz();
  }

  function renderQuiz() {
    var area = document.getElementById('quiz-area');
    if (!quiz) {
      var q = chState.quiz;
      area.innerHTML = '<div class="panel"><h2>Quiz ' + data.quiz.length + ' câu</h2>' +
        '<p class="muted">Câu hỏi tình huống để kiểm tra bạn có <b>vận dụng</b> được khái niệm không. Mỗi câu đều có giải thích, kể cả khi trả lời đúng.</p>' +
        (q.best != null ? '<p>Điểm cao nhất: <b>' + q.best + ' / ' + data.quiz.length + '</b> · Lần gần nhất: <b>' + q.last + '</b> · Số lần làm: ' + q.attempts + '</p>' : '') +
        '<div class="row"><button class="btn primary" id="btn-start-quiz">Bắt đầu</button></div></div>';
      document.getElementById('btn-start-quiz').onclick = function () { startQuiz(); };
      return;
    }
    if (quiz.i >= quiz.order.length) {
      var total = quiz.order.length, full = total === data.quiz.length;
      if (full) {
        chState.quiz.attempts += 1;
        chState.quiz.last = quiz.score;
        chState.quiz.best = chState.quiz.best == null ? quiz.score : Math.max(chState.quiz.best, quiz.score);
        saveStore();
      }
      var wrongList = quiz.wrong.map(function (k) {
        var qq = data.quiz[k];
        return '<li><b>' + fmt(qq.q) + '</b><br><span class="muted">Đáp án: ' + fmt(qq.options[qq.answer]) + ' · Mục ' + esc(qq.ref) + '</span></li>';
      }).join('');
      var pct = Math.round(quiz.score / total * 100);
      area.innerHTML = '<div class="panel"><h2>Kết quả: ' + quiz.score + ' / ' + total + ' (' + pct + '%)</h2>' +
        '<p class="muted">' + (pct === 100 ? 'Xuất sắc! Hãy quay lại làm lại sau vài ngày để chắc là vẫn nhớ.' :
          pct >= 70 ? 'Khá tốt. Xem lại các câu sai bên dưới và đọc lại mục tương ứng.' :
          'Nên đọc lại các mục bên dưới, rồi ôn flashcard trước khi làm lại.') + '</p>' +
        (wrongList ? '<h3 style="font-size:1rem;margin:14px 0 6px">Câu trả lời sai</h3><ol style="padding-left:20px;margin:0">' + wrongList + '</ol>' : '') +
        '<div class="row">' + (quiz.wrong.length ? '<button class="btn primary" id="btn-retry-wrong">Làm lại câu sai</button>' : '') +
        '<button class="btn" id="btn-retry-all">Làm lại tất cả</button></div>' +
        (full ? '' : '<p class="note">Lượt làm lại câu sai không tính vào điểm cao nhất.</p>') + '</div>';
      typeset(area);
      var w = quiz.wrong.slice();
      var b1 = document.getElementById('btn-retry-wrong'); if (b1) b1.onclick = function () { startQuiz(w); };
      document.getElementById('btn-retry-all').onclick = function () { startQuiz(); };
      return;
    }
    var qi = quiz.order[quiz.i], q = data.quiz[qi];
    if (!quiz.optOrder) quiz.optOrder = shuffle(q.options.map(function (_, k) { return k; }));
    var html = '<div class="progress"><span style="width:' + (quiz.i / quiz.order.length * 100) + '%"></span></div>' +
      '<div class="panel"><div class="meta muted" style="font-size:.82rem;margin-bottom:8px">Câu ' + (quiz.i + 1) + ' / ' + quiz.order.length + ' · Mục ' + esc(q.ref) + '</div>' +
      '<div class="qtext">' + fmt(q.q) + '</div><div class="opts">' +
      quiz.optOrder.map(function (k, pos) {
        var cls = '';
        if (quiz.answered) {
          if (k === q.answer) cls = ' correct';
          else if (k === quiz.picked) cls = ' wrong';
        }
        return '<button class="opt' + cls + '" data-k="' + k + '"' + (quiz.answered ? ' disabled' : '') + '><span class="letter">' + 'ABCD'[pos] + '</span><span>' + fmt(q.options[k]) + '</span></button>';
      }).join('') + '</div>';
    if (quiz.answered) {
      var ok = quiz.picked === q.answer;
      html += '<div class="explain"><div class="verdict ' + (ok ? 'ok">✓ Chính xác' : 'no">✗ Chưa đúng') + '</div>' + fmt(q.explain) + '</div>' +
        '<div class="row"><button class="btn primary" id="btn-next">' + (quiz.i + 1 < quiz.order.length ? 'Câu tiếp' : 'Xem kết quả') + '</button></div>' +
        '<div class="kbd">Phím tắt: <kbd>Enter</kbd> tiếp tục</div>';
    } else {
      html += '<div class="kbd">Phím tắt: <kbd>A</kbd>–<kbd>D</kbd> hoặc <kbd>1</kbd>–<kbd>4</kbd> để chọn</div>';
    }
    html += '</div>';
    area.innerHTML = html;
    typeset(area);
    area.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () { answer(parseInt(b.getAttribute('data-k'), 10)); }; });
    var nb = document.getElementById('btn-next'); if (nb) nb.onclick = nextQuestion;
  }

  function answer(k) {
    if (!quiz || quiz.answered || quiz.i >= quiz.order.length) return;
    var qi = quiz.order[quiz.i];
    quiz.answered = true; quiz.picked = k;
    if (k === data.quiz[qi].answer) quiz.score += 1; else quiz.wrong.push(qi);
    renderQuiz();
  }
  function nextQuestion() {
    if (!quiz || !quiz.answered) return;
    quiz.i += 1; quiz.answered = false; quiz.picked = null; quiz.optOrder = null;
    renderQuiz();
  }

  // ---------- Chứng minh ----------
  // Ba chế độ cho mỗi chứng minh: "Vì sao?" (chọn lý do cho từng bước), "Sắp xếp" (xếp lại các dòng),
  // "Tự suy ra" (gợi ý từng nấc rồi xem lời giải). Xong chế độ nào cũng tự chấm; lịch ôn dùng chung schedule() với flashcard.
  // Dữ liệu: data.proofs = [{ id, ref, title, start, goal, steps: [{ tex, why: { options, answer, explain } }], hints, note }]
  var MODES = [['why', 'Vì sao?'], ['order', 'Sắp xếp'], ['recall', 'Tự suy ra']];
  var proofUI = null; // { id, mode, queue, why | order | recall }

  function proofs() { return (data && data.proofs) || []; }
  function proofById(id) { return proofs().filter(function (p) { return p.id === id; })[0]; }
  function proofState(id) { return (chState.proofs || {})[id] || null; }
  function canOrder(p) { return p.steps.length >= 3; }
  function dueProofs() {
    var now = Date.now();
    return proofs().filter(function (p) { var s = proofState(p.id); return s && s.seen && s.due <= now; }).map(function (p) { return p.id; });
  }
  // dòng nối tiếp (bắt đầu bằng = hoặc ≤) thụt vào để các dấu bằng thẳng cột như khi viết tay
  function texBlock(tex) { return '<div class="ptex' + (/^\s*(=|\\le\b)/.test(tex) ? ' cont' : '') + '">' + fmt('$$' + tex + '$$') + '</div>'; }
  function reasonTag(st) { return st.why ? '<div class="reason">↳ ' + fmt(st.why.options[st.why.answer]) + '</div>' : ''; }

  function openProof(id, mode, queue) {
    var p = proofById(id);
    if (!p) return;
    if (mode === 'order' && !canOrder(p)) mode = 'why';
    proofUI = { id: id, mode: mode, queue: queue || null };
    resetProofMode();
    renderProofs();
    document.getElementById('tab-proofs').scrollIntoView({ block: 'start' });
  }
  function resetProofMode() {
    var p = proofById(proofUI.id);
    if (proofUI.mode === 'why') proofUI.why = { i: 1, picked: null, score: 0, optOrder: null };
    if (proofUI.mode === 'order') {
      var idx = p.steps.map(function (_, k) { return k; }).slice(1), pool = shuffle(idx);
      if (pool.join() === idx.join()) pool.reverse(); // không để sẵn đúng thứ tự
      proofUI.order = { placed: [], pool: pool, marks: null, tries: 0 };
    }
    if (proofUI.mode === 'recall') proofUI.recall = { hints: 0, solved: false };
  }

  function renderProofs() {
    var area = document.getElementById('proof-area');
    area.innerHTML = proofUI ? proofModeHtml() : proofListHtml();
    typeset(area);
  }

  function proofListHtml() {
    var due = dueProofs();
    var html = '<div class="panel pintro"><h2>Chứng minh</h2>' +
      '<p class="muted" style="margin:0">Ôn cách suy ra công thức, không chỉ kết quả. Chứng minh mới nên đi lần lượt ① chọn lý do cho từng bước → ② xếp lại các dòng → ③ tự suy ra với gợi ý. Khi ôn lại, dùng ③.</p>' +
      '<div class="row">' + (due.length
        ? '<button class="btn primary" data-pact="review">Ôn ' + due.length + ' chứng minh đến hạn</button>'
        : '<span class="muted">Hôm nay không có chứng minh nào đến hạn.</span>') + '</div></div><div class="plist">';
    proofs().forEach(function (p) {
      var s = proofState(p.id), lv = level(s), done = (chState.proofDone || {})[p.id] || {};
      var lvText = { new: 'Mới', learn: 'Đang học', known: 'Đã thuộc' }[lv];
      html += '<div class="pitem"><div class="meta"><span class="tagchip">Mục ' + esc(p.ref) + '</span><span><span class="lvl ' + lv + '">' + lvText + '</span>' +
        (s && s.seen ? ' · ôn ' + esc(fmtDate(s.due)) : '') + '</span></div>' +
        '<h3>' + fmt(p.title) + '</h3>' + fmt(p.goal) + '<div class="row">' +
        MODES.map(function (m, k) {
          if (m[0] === 'order' && !canOrder(p)) return '';
          return '<button class="btn pmode' + (done[m[0]] ? ' done' : '') + '" data-pact="open" data-id="' + esc(p.id) + '" data-mode="' + m[0] + '">' +
            '①②③'[k] + ' ' + m[1] + (done[m[0]] ? ' ✓' : '') + '</button>';
        }).join('') + '</div></div>';
    });
    return html + '</div>';
  }

  function proofModeHtml() {
    var p = proofById(proofUI.id);
    var body = proofUI.mode === 'why' ? whyHtml(p) : proofUI.mode === 'order' ? orderHtml(p) : recallHtml(p);
    return '<div class="ptop"><button class="btn" data-pact="back">← Danh sách</button>' +
      (proofUI.queue ? '<span class="muted" style="font-size:.88rem">Ôn đến hạn · còn ' + proofUI.queue.length + ' sau bài này</span>' : '') + '</div>' +
      '<div class="panel"><div class="pseg" role="group" aria-label="Chế độ">' +
      MODES.map(function (m) {
        if (m[0] === 'order' && !canOrder(p)) return '';
        return '<button data-pact="mode" data-mode="' + m[0] + '" aria-pressed="' + (proofUI.mode === m[0]) + '">' + m[1] + '</button>';
      }).join('') + '</div>' +
      '<h2>' + fmt(p.title) + '</h2>' +
      '<div class="pgiven"><div class="lbl2">Xuất phát</div>' + fmt(p.start) + '</div>' +
      '<div class="pgiven"><div class="lbl2">Cần chứng minh</div>' + fmt(p.goal) + '</div>' + body + '</div>';
  }

  // ① Vì sao?
  function whyHtml(p) {
    var w = proofUI.why, html = '', total = p.steps.length - 1;
    html += '<div class="pstep fixed">' + texBlock(p.steps[0].tex) + '</div>';
    for (var k = 1; k < w.i; k++) html += '<div class="pstep">' + texBlock(p.steps[k].tex) + reasonTag(p.steps[k]) + '</div>';
    if (w.i >= p.steps.length) {
      return html + '<div class="explain"><div class="verdict ' + (w.score === total ? 'ok' : 'no') + '">Xong: chọn đúng ' + w.score + '/' + total + ' lý do.</div>' +
        (p.note ? fmt(p.note) : '') + '</div>' + proofGradeHtml(p);
    }
    var st = p.steps[w.i];
    if (!w.optOrder) w.optOrder = shuffle(st.why.options.map(function (_, k) { return k; }));
    html += '<div class="pstep cur">' + texBlock(st.tex) + '</div>' +
      '<div class="pq">Bước ' + w.i + '/' + total + ': vì sao dòng được tô đúng?</div><div class="opts">' +
      w.optOrder.map(function (k, pos) {
        var cls = w.picked == null ? '' : k === st.why.answer ? ' correct' : k === w.picked ? ' wrong' : '';
        return '<button class="opt' + cls + '" data-pact="pick" data-k="' + k + '"' + (w.picked != null ? ' disabled' : '') + '><span class="letter">' +
          'ABCD'[pos] + '</span><span>' + fmt(st.why.options[k]) + '</span></button>';
      }).join('') + '</div>';
    if (w.picked != null) {
      var ok = w.picked === st.why.answer;
      html += '<div class="explain"><div class="verdict ' + (ok ? 'ok">✓ Chính xác' : 'no">✗ Chưa đúng') + '</div>' + fmt(st.why.explain) + '</div>' +
        '<div class="row"><button class="btn primary" data-pact="next">' + (w.i + 1 < p.steps.length ? 'Bước tiếp' : 'Xem kết quả') + '</button></div>' +
        '<div class="kbd">Phím tắt: <kbd>Enter</kbd> tiếp tục</div>';
    } else {
      html += '<div class="kbd">Phím tắt: <kbd>A</kbd>–<kbd>D</kbd> hoặc <kbd>1</kbd>–<kbd>4</kbd> để chọn</div>';
    }
    return html;
  }
  function pickWhy(k) {
    var w = proofUI.why, st = proofById(proofUI.id).steps[w.i];
    if (w.picked != null || !st) return;
    w.picked = k;
    if (k === st.why.answer) w.score += 1;
    renderProofs();
  }
  function nextWhy() {
    var w = proofUI.why;
    if (w.picked == null) return;
    w.i += 1; w.picked = null; w.optOrder = null;
    renderProofs();
  }

  // ② Sắp xếp
  function orderHtml(p) {
    var o = proofUI.order, solved = o.marks && !o.pool.length && o.marks.every(Boolean);
    var html = '<p class="muted pnote">' + (solved ? 'Thứ tự đúng:' : 'Chạm vào một dòng ở ô bên dưới để nối nó vào chứng minh; chạm vào dòng đã xếp để trả lại.') + '</p>' +
      '<div class="pstep fixed">' + texBlock(p.steps[0].tex) + '</div>';
    o.placed.forEach(function (k, pos) {
      var mark = o.marks ? (o.marks[pos] ? ' ok' : ' bad') : '';
      html += solved
        ? '<div class="pstep ok">' + texBlock(p.steps[k].tex) + reasonTag(p.steps[k]) + '</div>'
        : '<div class="pstep' + mark + '" role="button" tabindex="0" data-pact="unplace" data-pos="' + pos + '" aria-label="Trả dòng ' + (pos + 2) + ' về ô bên dưới">' + texBlock(p.steps[k].tex) + '</div>';
    });
    if (solved) {
      return html + '<div class="explain"><div class="verdict ok">✓ Đúng thứ tự' + (o.tries > 1 ? ' sau ' + o.tries + ' lần kiểm tra' : ' ngay lần đầu') + '.</div>' +
        (p.note ? fmt(p.note) : '') + '</div>' + proofGradeHtml(p);
    }
    if (o.pool.length) {
      html += '<div class="ppool-l">Các dòng còn lại (' + o.pool.length + ')</div><div class="ppool">' +
        o.pool.map(function (k) { return '<div class="pstep" role="button" tabindex="0" data-pact="place" data-k="' + k + '">' + texBlock(p.steps[k].tex) + '</div>'; }).join('') + '</div>';
    } else if (!o.marks) {
      html += '<div class="row"><button class="btn primary" data-pact="check">Kiểm tra</button></div>';
    } else {
      var n = o.marks.filter(Boolean).length;
      html += '<div class="explain"><div class="verdict no">' + n + '/' + o.marks.length + ' dòng đúng vị trí.</div>' +
        'Dòng xanh đúng chỗ, dòng đỏ sai chỗ. "Sửa lại" giữ các dòng đúng liên tiếp từ đầu và trả phần còn lại về ô bên dưới.</div>' +
        '<div class="row"><button class="btn primary" data-pact="fix">Sửa lại</button></div>';
    }
    return html;
  }
  function orderAction(a, el) {
    var o = proofUI.order;
    if (a === 'place') {
      var k = parseInt(el.getAttribute('data-k'), 10), i = o.pool.indexOf(k);
      if (i < 0) return;
      o.pool.splice(i, 1); o.placed.push(k); o.marks = null;
    } else if (a === 'unplace') {
      var pos = parseInt(el.getAttribute('data-pos'), 10);
      o.pool.push(o.placed.splice(pos, 1)[0]); o.marks = null;
    } else if (a === 'check') {
      o.tries += 1;
      o.marks = o.placed.map(function (k, pos) { return k === pos + 1; });
    } else if (a === 'fix') {
      var keep = 0;
      while (keep < o.marks.length && o.marks[keep]) keep++;
      o.pool = shuffle(o.pool.concat(o.placed.splice(keep))); o.marks = null;
    }
    renderProofs();
  }

  // ③ Tự suy ra
  function recallHtml(p) {
    var r = proofUI.recall;
    var html = '<p class="muted pnote">Tự viết chứng minh ra giấy trước. Bí thì mở gợi ý từng nấc; xong thì xem lời giải để đối chiếu từng bước.</p>';
    for (var k = 0; k < r.hints; k++) html += '<div class="phint"><div class="lbl2">Gợi ý ' + (k + 1) + '</div>' + fmt(p.hints[k]) + '</div>';
    if (!r.solved) {
      return html + '<div class="row">' + (r.hints < p.hints.length ? '<button class="btn" data-pact="hint">Gợi ý ' + (r.hints + 1) + '/' + p.hints.length + '</button>' : '') +
        '<button class="btn primary" data-pact="solve">Xem lời giải đầy đủ</button></div>';
    }
    html += '<div class="psol">Lời giải</div>' + p.steps.map(function (st, k) {
      return '<div class="pstep' + (k ? '' : ' fixed') + '">' + texBlock(st.tex) + reasonTag(st) + '</div>';
    }).join('');
    if (p.note) html += '<div class="explain">' + fmt(p.note) + '</div>';
    return html + proofGradeHtml(p, r.hints);
  }

  function proofGradeHtml(p, hintsUsed) {
    var st = proofState(p.id), labels = { again: 'Quên', hard: 'Khó', good: 'Nhớ' };
    var q = proofUI.mode === 'recall'
      ? 'Bạn tự suy ra được đến đâu?' + (hintsUsed ? ' (đã dùng ' + hintsUsed + ' gợi ý)' : '')
      : 'Bạn hiểu chứng minh này đến đâu?';
    return '<div class="pgrade"><div class="lbl2">' + q + '</div><div class="grades">' + ['again', 'hard', 'good'].map(function (g) {
      var preview = g === 'again' ? 'ôn lại hôm nay' : fmtDays(schedule(st, g).interval);
      return '<button class="grade ' + g + '" data-pact="grade" data-g="' + g + '">' + labels[g] + '<small>' + preview + '</small></button>';
    }).join('') + '</div><div class="kbd">Phím tắt: <kbd>1</kbd> Quên · <kbd>2</kbd> Khó · <kbd>3</kbd> Nhớ</div></div>';
  }
  function gradeProof(g) {
    var id = proofUI.id;
    chState.proofs = chState.proofs || {};
    chState.proofs[id] = schedule(proofState(id), g);
    chState.proofDone = chState.proofDone || {};
    (chState.proofDone[id] = chState.proofDone[id] || {})[proofUI.mode] = 1;
    saveStore();
    toast(g === 'again' ? 'Sẽ ôn lại chứng minh này hôm nay' : 'Ôn lại sau ' + fmtDays(chState.proofs[id].interval));
    var q = proofUI.queue;
    if (q && q.length) openProof(q.shift(), 'recall', q);
    else { proofUI = null; renderProofs(); }
  }

  function proofAction(a, el) {
    if (a === 'open') return openProof(el.getAttribute('data-id'), el.getAttribute('data-mode'));
    if (a === 'review') { var q = dueProofs(); return openProof(q.shift(), 'recall', q); }
    if (!proofUI) return;
    if (a === 'back') { proofUI = null; renderProofs(); }
    else if (a === 'mode') { proofUI.mode = el.getAttribute('data-mode'); resetProofMode(); renderProofs(); }
    else if (a === 'pick') pickWhy(parseInt(el.getAttribute('data-k'), 10));
    else if (a === 'next') nextWhy();
    else if (a === 'place' || a === 'unplace' || a === 'check' || a === 'fix') orderAction(a, el);
    else if (a === 'hint') { proofUI.recall.hints += 1; renderProofs(); }
    else if (a === 'solve') { proofUI.recall.solved = true; renderProofs(); }
    else if (a === 'grade') gradeProof(el.getAttribute('data-g'));
  }
  (function bindProofArea() {
    var area = document.getElementById('proof-area');
    area.addEventListener('click', function (e) {
      var el = e.target.closest && e.target.closest('[data-pact]');
      if (el && area.contains(el) && !el.disabled) proofAction(el.getAttribute('data-pact'), el);
    });
    // các dòng xếp được là <div role="button">: cho bấm bằng Enter / Space
    area.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-pact]')) {
        e.preventDefault(); e.stopPropagation(); proofAction(e.target.getAttribute('data-pact'), e.target);
      }
    });
  })();
  function proofKey(e) {
    if (document.querySelector('#proof-area .pgrade')) {
      var g = { '1': 'again', '2': 'hard', '3': 'good' }[e.key];
      if (g) { e.preventDefault(); gradeProof(g); }
      return;
    }
    if (proofUI.mode !== 'why') return;
    var w = proofUI.why;
    if (w.picked == null) {
      var k = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 }[e.key.toLowerCase()];
      if (k != null && w.optOrder && k < w.optOrder.length) { e.preventDefault(); pickWhy(w.optOrder[k]); }
    } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextWhy(); }
  }

  // ---------- Tiến độ ----------
  function renderProgress() {
    var now = Date.now(), counts = { new: 0, learn: 0, known: 0 }, due = 0;
    var rows = data.cards.map(function (c) {
      var s = cardState(c.id), lv = level(s);
      counts[lv]++;
      if (s && s.seen && s.due <= now) due++;
      var lvText = { new: 'Mới', learn: 'Đang học', known: 'Đã thuộc' }[lv];
      return '<tr><td>' + fmt(c.front) + '</td><td><span class="lvl ' + lv + '">' + lvText + '</span></td><td class="muted">' +
        (s && s.seen ? esc(fmtDate(s.due)) : '–') + '</td></tr>';
    }).join('');
    var q = chState.quiz;
    document.getElementById('progress-area').innerHTML =
      '<h2>Tiến độ chương ' + esc(CH) + '</h2>' +
      '<div class="stat-grid">' +
        '<div class="stat"><div class="n">' + counts.known + '</div><div class="l">Đã thuộc (khoảng ôn ≥ 7 ngày)</div></div>' +
        '<div class="stat"><div class="n">' + counts.learn + '</div><div class="l">Đang học</div></div>' +
        '<div class="stat"><div class="n">' + counts.new + '</div><div class="l">Chưa học</div></div>' +
        '<div class="stat"><div class="n">' + (q.best != null ? q.best + '/' + data.quiz.length : '–') + '</div><div class="l">Điểm quiz cao nhất</div></div>' +
        (proofs().length ? '<div class="stat"><div class="n">' + proofs().filter(function (p) { return level(proofState(p.id)) === 'known'; }).length + '/' + proofs().length +
          '</div><div class="l">Chứng minh đã thuộc</div></div>' : '') +
      '</div>' +
      '<p class="muted" style="margin:8px 0 0">Cần ôn hôm nay: <b>' + due + '</b> thẻ' + (proofs().length ? ', <b>' + dueProofs().length + '</b> chứng minh' : '') + '.</p>' +
      '<div class="row">' +
        '<button class="btn" id="btn-export">Xuất tiến độ</button>' +
        '<button class="btn" id="btn-import">Nhập tiến độ</button>' +
        '<button class="btn" id="btn-reset">Xóa tiến độ chương này</button>' +
        '<input type="file" id="file-import" accept="application/json,.json" class="hidden">' +
      '</div>' +
      '<p class="note">Tiến độ chỉ lưu trong trình duyệt này. Muốn chuyển sang máy khác, bấm "Xuất tiến độ" để tải file, rồi "Nhập tiến độ" ở máy kia. Xóa dữ liệu trình duyệt sẽ mất tiến độ.</p>' +
      '<table><thead><tr><th>Thẻ</th><th>Mức</th><th>Ôn tiếp</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      (proofs().length ? '<table><thead><tr><th>Chứng minh</th><th>Mức</th><th>Ôn tiếp</th></tr></thead><tbody>' + proofs().map(function (p) {
        var s = proofState(p.id), lv = level(s);
        return '<tr><td>' + fmt(p.title) + '</td><td><span class="lvl ' + lv + '">' + { new: 'Mới', learn: 'Đang học', known: 'Đã thuộc' }[lv] +
          '</span></td><td class="muted">' + (s && s.seen ? esc(fmtDate(s.due)) : '–') + '</td></tr>';
      }).join('') + '</tbody></table>' : '');
    typeset(document.getElementById('progress-area'));

    document.getElementById('btn-export').onclick = function () {
      var blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'easyrl-vi-tien-do-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    };
    var fileInput = document.getElementById('file-import');
    document.getElementById('btn-import').onclick = function () { fileInput.click(); };
    fileInput.onchange = function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var s = JSON.parse(r.result);
          if (!s || typeof s !== 'object' || !s.chapters) throw new Error('bad');
          store = s; ensureChapter(); saveStore(); session = null; quiz = null; proofUI = null;
          buildSession(false); renderAll(); toast('Đã nhập tiến độ');
        } catch (e) { toast('File không hợp lệ'); }
      };
      r.readAsText(f);
    };
    document.getElementById('btn-reset').onclick = function () {
      if (!confirm('Xóa toàn bộ tiến độ flashcard, quiz' + (proofs().length ? ', chứng minh' : '') + ' của chương ' + CH + '?')) return;
      delete store.chapters[CH]; ensureChapter(); saveStore(); session = null; quiz = null; proofUI = null;
      buildSession(false); renderAll(); toast('Đã xóa tiến độ');
    };
  }

  // ---------- tab & phím tắt ----------
  var current = 'cards';
  var extras = []; // tab mở rộng của chương (thí nghiệm, sơ đồ), nạp từ file JS riêng
  function tabNames() { return ['cards', 'quiz'].concat(proofs().length ? ['proofs'] : [], extras.map(function (x) { return x.id; }), ['progress']); }
  function showTab(name) {
    if (tabNames().indexOf(name) < 0) name = 'cards';
    current = name;
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.getAttribute('data-tab') === name ? 'true' : 'false'); });
    tabNames().forEach(function (n) { document.getElementById('tab-' + n).classList.toggle('hidden', n !== name); });
    if (name === 'cards') renderCard();
    if (name === 'quiz') renderQuiz();
    if (name === 'proofs') renderProofs();
    if (name === 'progress') renderProgress();
    extras.forEach(function (x) {
      if (x.id === name && !x.rendered) { x.rendered = true; x.render(document.getElementById('tab-' + x.id), { typeset: typeset, esc: esc }); }
    });
    try { sessionStorage.setItem('easyrl-vi:review:tab:' + CH, name); } catch (e) {}
  }
  function renderAll() { showTab(current); }

  function bindTabs() {
    document.querySelectorAll('.tab').forEach(function (t) { t.onclick = function () { showTab(t.getAttribute('data-tab')); }; });
  }
  bindTabs();
  function loadExtras(src) {
    return new Promise(function (resolve) {
      if (!src) return resolve();
      var sc = document.createElement('script');
      sc.src = src;
      sc.onload = function () {
        var ex = (window.ReviewExtras && window.ReviewExtras.tabs) || [];
        var progBtn = document.querySelector('.tab[data-tab="progress"]'), progSec = document.getElementById('tab-progress');
        ex.forEach(function (x) {
          var b = document.createElement('button');
          b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', 'false'); b.setAttribute('data-tab', x.id); b.textContent = x.label;
          progBtn.parentNode.insertBefore(b, progBtn);
          var sec = document.createElement('section'); sec.id = 'tab-' + x.id; sec.className = 'hidden';
          progSec.parentNode.insertBefore(sec, progSec);
          extras.push({ id: x.id, render: x.render, rendered: false });
        });
        bindTabs(); resolve();
      };
      sc.onerror = function () { resolve(); };
      document.head.appendChild(sc);
    });
  }
  document.addEventListener('click', function (e) {
    var go = e.target.closest && e.target.closest('[data-go]');
    if (go) showTab(go.getAttribute('data-go'));
  });
  document.addEventListener('keydown', function (e) {
    if (!data || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (current === 'cards' && session && session.queue.length) {
      if (!session.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flip(); }
      else if (session.flipped) {
        var map = session.practice ? { '1': 'again', '2': 'good' } : { '1': 'again', '2': 'hard', '3': 'good' };
        if (map[e.key]) { e.preventDefault(); grade(map[e.key]); }
      }
    } else if (current === 'quiz' && quiz && quiz.i < quiz.order.length) {
      if (!quiz.answered) {
        var k = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 }[e.key.toLowerCase()];
        if (k != null && quiz.optOrder && k < quiz.optOrder.length) { e.preventDefault(); answer(quiz.optOrder[k]); }
      } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextQuestion(); }
    } else if (current === 'proofs' && proofUI) {
      proofKey(e);
    }
  });

  // ---------- tải dữ liệu chương ----------
  fetch('ch' + CH + '.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      data = d;
      document.title = 'Ôn tập ' + d.title.split('·')[0].trim() + ' · Sách Nấm EasyRL';
      document.getElementById('title').textContent = 'Ôn tập · ' + d.title;
      if (d.chapterLink) document.getElementById('lnk-chapter').href = d.chapterLink;
      if (d.exerciseLink) document.getElementById('lnk-ex').href = d.exerciseLink;
      ensureChapter();
      buildSession(false);
      if (proofs().length) document.querySelector('.tab[data-tab="proofs"]').classList.remove('hidden');
      return loadExtras(d.extras).then(function () {
        var saved = null;
        try { saved = sessionStorage.getItem('easyrl-vi:review:tab:' + CH); } catch (e) {}
        showTab(saved || 'cards');
      });
    })
    .catch(function () {
      var el = document.getElementById('err');
      el.classList.remove('hidden');
      el.innerHTML = '<h2>Chưa có bộ ôn tập cho chương ' + esc(CH) + '</h2><p class="muted">Hiện đã có chương 1 đến 10. ' +
        'Nếu bạn mở file trực tiếp trên máy (file://), hãy chạy <code>python3 -m http.server</code> trong thư mục <code>docs</code> rồi mở qua http://localhost.</p>' +
        '<p><a href="?ch=1">Ôn tập chương 1</a> · <a href="?ch=2">Ôn tập chương 2</a> · <a href="?ch=3">Ôn tập chương 3</a> · <a href="?ch=4">Ôn tập chương 4</a> · <a href="?ch=5">Ôn tập chương 5</a> · <a href="?ch=6">Ôn tập chương 6</a> · <a href="?ch=7">Ôn tập chương 7</a> · <a href="?ch=8">Ôn tập chương 8</a> · <a href="?ch=9">Ôn tập chương 9</a> · <a href="?ch=10">Ôn tập chương 10</a></p>';
      document.querySelectorAll('section, .tabs').forEach(function (s) { s.classList.add('hidden'); });
    });
})();
</script>
</body>
</html>
