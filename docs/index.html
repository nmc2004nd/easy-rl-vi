  <script>
    // Đặt nền sáng/tối trước khi vẽ trang để không bị chớp.
    try { var t = localStorage.getItem('easyrl-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    // Mô phỏng nhúng (docs/viz/*.html) báo chiều cao qua postMessage để iframe tự giãn
    window.addEventListener('message', function (e) {
      if (!e.data || !e.data.vizHeight) return;
      document.querySelectorAll('iframe.viz-frame').forEach(function (f) {
        if (f.contentWindow === e.source) f.style.height = (e.data.vizHeight + 8) + 'px';
      });
    });
  </script>
  <script>
    window.$docsify = {
      name: 'Sách Nấm EasyRL',
      loadSidebar: '_sidebar_vi.md',
      homepage: 'home_vi.md',
      // Chuyển sang trang khác thì cuộn lên đầu (trừ khi link trỏ tới một mục cụ thể ?id=...)
      auto2top: true,
      alias: { '/.*/_sidebar_vi.md': '/_sidebar_vi.md' },
      // markdown: {
      //   latexRender: katex.renderToString.bind(katex)
      // },
      search:{
        placeholder:'Tìm bài học, thuật toán…',
        noData:'Không tìm thấy kết quả',
        paths:'auto',
        depth:6
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            // Được gọi mỗi khi bắt đầu phân tích nội dung Markdown
            // Thay tất cả ../img thành img
            // https://github.com/docsifyjs/docsify/issues/936
            return content.replace(/\.\.\/img/g, "img");
          })

          // hook.doneEach(function () {
          //   window.MathJax.Hub.Queue(["Typeset", MathJax.Hub, document.getElementById('app')]);
          // }) 
        }
      ],
    }
  </script>
  <script src="theme/agent.js"></script>
  <script src="theme/nav-icons.js"></script>
  <script src="theme/site.js"></script>
